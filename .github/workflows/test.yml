# separate terms of service, privacy policy, and support
# documentation.

name: Elixir CI

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        id: beam
        with:
          elixir-version: 'v1.20.5' # [Required] Define the Elixir version
          otp-version: '29.1.2'      # [Required] Define the Erlang/OTP version

      - name: Restore dependencies cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Restore PLT cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: plt_cache
        with:
          path: plts
          key: ${{ runner.os }}-plt-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}
          restore-keys: ${{ runner.os }}-plt-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}

      - name: Run tests
        run: mix test
        env:
          # runs of each consistency property in test/wongi/scenarios
          PROPERTY_RUNS: 1000

      - name: Run tests without token indexes
        run: mix test
        env:
          TOKEN_INDEXES: "false"
          PROPERTY_RUNS: 1000

      - name: Create PLTs
        if: steps.plt_cache.outputs.cache-hit != 'true'
        run: mix dialyzer --plt

      - name: Lint
        run: mix lint.ci

  bench:

    name: Benchmark
    runs-on: ubuntu-latest
    permissions:
      # to push results from main to gh-pages
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: 'v1.20.5' # [Required] Define the Elixir version
          otp-version: '29.1.2'      # [Required] Define the Erlang/OTP version

      - name: Restore dependencies cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Build
        run: mix do deps.get + compile
        env:
          MIX_ENV: prod

      - name: Run benchmark
        run: mix run bench/workload.exs 2000 --runs 5 --json bench.json | tee bench.txt
        env:
          MIX_ENV: prod

      # Results from main are kept in the gh-pages branch, which also has a chart
      # of them under dev/bench. Anything else is compared against the latest of
      # those, and fails if it is much slower.
      - name: Compare with earlier results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Workload
          tool: customSmallerIsBetter
          output-file-path: bench.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          alert-threshold: '150%'
          fail-on-alert: true
          summary-always: true

      - name: Upload results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-${{ github.sha }}
          path: |
            bench.json
            bench.txt
          retention-days: 90

  publish:
    
    if: github.ref_type == 'tag'
    needs: build
    name: Publish to Hex.pm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        id: beam
        with:
          elixir-version: 'v1.20.5' # [Required] Define the Elixir version
          otp-version: '29.1.2'      # [Required] Define the Erlang/OTP version

      - name: Restore dependencies cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Build
        run: mix do deps.get + compile

      - name: Publish
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
